name: Run Job Alert Parser
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Code Check out
        uses: actions/checkout@v4

      - name: Initialize Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Upgraded to 3.11

      - name: Install Libraries
        run: pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib google-genai # Updated to modern genai package
        
      - name: Execute Pipeline Script
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
